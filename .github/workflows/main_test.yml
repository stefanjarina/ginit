name: Main Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags-ignore:
      - 'v*'
  # Use `pull_request` (never `pull_request_target`): fork PRs run with a
  # read-only GITHUB_TOKEN and no access to repository secrets.
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      - name: Build
        run: task build

      - name: Test
        run: task test

      - name: Smoke CLI
        run: task smoke

  # Config file ACLs are Windows specific; see config/private_windows.go.
  config-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      - name: Test config
        run: go test ./config/...
