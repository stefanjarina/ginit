name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      - name: Build Binaries
        run: task build-all

      - name: Create Github Release
        uses: softprops/action-gh-release@v3
        if: ${{ !env.ACT }}
        with:
          files: |
            ./publish/*
          make_latest: true
